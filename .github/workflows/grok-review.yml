name: Grok central PR review

on: # yamllint disable-line rule:truthy
  repository_dispatch:
    types: [grok-pr-review]
  workflow_dispatch:
    inputs:
      repository:
        description: Target owner/repo
        required: true
        type: string
      number:
        description: Pull request number
        required: true
        type: number
  pull_request:
    paths:
      - .github/workflows/grok-review.yml
      - .github/actions/grok-review/**

permissions:
  contents: read

concurrency:
  group: grok-review-${{ github.event.client_payload.repository || inputs.repository || github.event.pull_request.number }}-${{ github.event.client_payload.number || inputs.number || github.sha }}
  cancel-in-progress: false

jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Grok Action sources
        shell: bash
        run: |
          set -euo pipefail
          for source in .github/actions/grok-review/src/*.mjs; do
            node --check "$source"
          done
          node --test .github/actions/grok-review/test/*.test.mjs

  review:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Independent Grok review
        uses: ./.github/actions/grok-review
        with:
          repository: ${{ github.event.client_payload.repository || inputs.repository }}
          number: ${{ github.event.client_payload.number || inputs.number }}
          head-sha: ${{ github.event.client_payload.head_sha || '' }}
          xai-api-key: ${{ secrets.XAI_API_KEY }}
