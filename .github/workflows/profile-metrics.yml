name: Profile metrics

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-metrics.yml
      - .github/scripts/profile-badges.cjs
      - .github/scripts/profile-badges.test.cjs
      - profile/README.md
      - profile/README_pl.md
      - profile/README_zh.md
  pull_request:
    paths:
      - .github/workflows/profile-metrics.yml
      - .github/scripts/profile-badges.cjs
      - .github/scripts/profile-badges.test.cjs
      - profile/README.md
      - profile/README_pl.md
      - profile/README_zh.md
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

concurrency:
  group: profile-metrics-${{ github.repository }}-${{ github.event.pull_request.number || 'refresh' }}
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate profile badges
        run: node --test .github/scripts/profile-badges.test.cjs

  badges:
    if: github.event_name != 'pull_request' && github.repository == 'travnie/.github'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate native badges and repository activity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const run = require("./.github/scripts/profile-badges.cjs");
            await run({ github, core });

      - name: Publish badge SVGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/metrics/{merged-prs.svg,repo-size.svg,activity.svg}
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh badge SVGs [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  refresh:
    if: github.event_name != 'pull_request' && github.repository == 'travnie/.github'
    needs: badges
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "RSS: JBZD via Feedseek"
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # latest/v3.34
        with:
          user: travnie
          token: NOT_NEEDED
          base: ""
          filename: rss.svg
          output_action: none
          plugin_rss: yes
          plugin_rss_source: https://trvny.github.io/feedseek/jbzd.xml
          plugin_rss_limit: 5
          config_timezone: Europe/Warsaw

      - name: Publish rendered cards
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p assets/profile/metrics
          test -s /metrics_renders/rss.svg
          sudo install -m 644 /metrics_renders/rss.svg assets/profile/metrics/rss.svg
          git add assets/profile/metrics/rss.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh RSS card [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
