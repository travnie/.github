name: Profile metrics

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-metrics.yml
      - .github/scripts/profile-badges.cjs
      - .github/scripts/profile-badges.test.cjs
      - profile/README.md
      - profile/README_pl.md
      - profile/README_zh.md
  pull_request:
    paths:
      - .github/workflows/profile-metrics.yml
      - .github/scripts/profile-badges.cjs
      - .github/scripts/profile-badges.test.cjs
      - profile/README.md
      - profile/README_pl.md
      - profile/README_zh.md
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

concurrency:
  group: profile-metrics-${{ github.repository }}-${{ github.event.pull_request.number || 'refresh' }}
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate profile badges
        run: node --test .github/scripts/profile-badges.test.cjs

  badges:
    if: github.event_name != 'pull_request' && github.repository == 'travnie/.github'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate native SVG badges
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const run = require("./.github/scripts/profile-badges.cjs");
            await run({ github, core });

      - name: Publish badge SVGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/metrics/{merged-prs.svg,repo-size.svg}
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh badge SVGs [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  refresh:
    if: github.event_name != 'pull_request' && github.repository == 'travnie/.github'
    needs: badges
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - name: Check Metrics token
        id: metrics_auth
        env:
          DATA_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GH_PAT }}
        run: |
          if [ -n "$DATA_TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Set METRICS_TOKEN or GH_PAT to enable organization activity and code'
          fi

      - name: "RSS: JBZD via Feedseek"
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # latest/v3.34
        with:
          user: travnie
          token: NOT_NEEDED
          base: ""
          filename: rss.svg
          output_action: none
          plugin_rss: yes
          plugin_rss_source: https://trvny.github.io/feedseek/jbzd.xml
          plugin_rss_limit: 5
          config_timezone: Europe/Warsaw

      - name: Activity, code, and mildly interesting habits
        if: steps.metrics_auth.outputs.enabled == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # latest/v3.34
        with:
          user: travnie
          token: ${{ secrets.METRICS_TOKEN || secrets.GH_PAT }}
          base: ""
          filename: activity.svg
          output_action: none
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 30
          plugin_activity_visibility: public
          plugin_activity_filter: push, pr, review, release
          plugin_code: yes
          plugin_code_days: 30
          plugin_code_visibility: public
          plugin_code_lines: 8
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no
          config_timezone: Europe/Warsaw
          config_order: activity, code, habits

      - name: Publish rendered cards
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p assets/profile/metrics
          test -s /metrics_renders/rss.svg
          sudo install -m 644 /metrics_renders/rss.svg assets/profile/metrics/rss.svg
          for name in activity; do
            if [ -s "/metrics_renders/$name.svg" ]; then
              sudo install -m 644 "/metrics_renders/$name.svg" "assets/profile/metrics/$name.svg"
            else
              echo "::warning::$name card skipped (METRICS_TOKEN or GH_PAT required)"
              if [ ! -s "assets/profile/metrics/$name.svg" ]; then
                echo '<svg xmlns="http://www.w3.org/2000/svg" width="620" height="65" viewBox="0 0 620 65"><rect width="620" height="65" rx="8" fill="#20252d"/><text x="20" y="37" font-family="monospace" font-size="16" fill="#ced4df">GitHub metrics: configure METRICS_TOKEN</text></svg>' > "assets/profile/metrics/$name.svg"
              fi
            fi
          done
          git add assets/profile/metrics/{rss.svg,activity.svg}
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh metrics cards [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
