name: travnie CodeQL shared analysis policy

# Applied through the github-codeql-config-file repository property to both
# Default Setup and Advanced Setup. This file controls query coverage, not jobs.
# Setup mode is managed by trvny/.github; custom builds stay in each repository.
queries:
  - uses: security-extended

# Broaden taint sources for languages that support local threat modeling.
threat-models:
  - local

# Exclude dependency trees and generated build artifacts, not first-party source.
paths-ignore:
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/vendor/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/.next/**"
  - "**/.nuxt/**"
  - "**/target/**"
