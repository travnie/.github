name: Grok PR Review
description: Review one GitHub PR through xAI Responses and publish using scoped Kanarek App identity.

inputs:
  repository:
    description: Target owner/repo
    required: true
  number:
    description: Pull request number
    required: true
  head-sha:
    description: Expected PR head SHA (optional for manual runs)
    required: false
    default: ''
  xai-api-key:
    description: xAI API credential, provided by the trusted caller
    required: true

runs:
  using: composite
  steps:
    - name: Exchange Actions OIDC for review App installation
      id: auth
      shell: bash
      env:
        TARGET_REPOSITORY: ${{ inputs.repository }}
      run: node "$GITHUB_ACTION_PATH/src/oidc.mjs"
    - name: Request and publish Grok review
      shell: bash
      env:
        TARGET_REPOSITORY: ${{ inputs.repository }}
        TARGET_NUMBER: ${{ inputs.number }}
        EXPECTED_HEAD_SHA: ${{ inputs.head-sha }}
        GROK_GH_TOKEN: ${{ steps.auth.outputs.token }}
        XAI_API_KEY: ${{ inputs.xai-api-key }}
      run: node "$GITHUB_ACTION_PATH/src/review.mjs"
